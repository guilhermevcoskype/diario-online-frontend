<!-- src/app/app.component.html -->

<header class="app-header">
  <!-- Removido o UL/LI extra e agrupado tudo em uma NAV -->
  <nav class="app-nav">
    <ul>
      <li>
        <!-- Use routerLink, não href, para navegação interna do Angular -->
        <a routerLink="/home" routerLinkActive="active" aria-label="Navegar para Home">HOME</a>
      </li>
      <li>
        <a routerLink="/registrar" routerLinkActive="active" aria-label="Navegar para Registrar">REGISTRAR</a>
      </li>
    </ul>
  </nav>
</header>

<main class="app-main">
  <!-- O router-outlet fica aqui para o conteúdo ser renderizado -->
  <router-outlet />
</main>

<footer class="app-footer">
  <p>© 2025 Diario-Online. All rights reserved.</p>
</footer>
