<div class="app-user-data-show">

    <h2>Minha Lista de Jogos</h2>
    <div class="games-list">
        @for (media of medias; track media.gameId) {
            <div class="media-item" (click)="goMediaPage(media)">
                <img class="cover" src="{{ media.cover }}" alt="{{ media.name }} cover" />
                <h3 [title]="media.name">{{ media.name }}</h3>
            </div>
        }@empty {
            <p>Sem jogos para mostrar</p>
        }
    </div>
</div>
