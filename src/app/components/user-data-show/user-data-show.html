<div class="user-list-container">
    <header class="list-header">
        <h1>🎮 Minha Coleção</h1>
        <p>Você tem <strong>{{ medias.length }}</strong> jogos registrados</p>
    </header>

    <div class="games-grid">
        @for (media of medias; track media.gameId) {
            <div class="game-card" (click)="goMediaPage(media)">
                <div class="card-image">
                    <img [src]="!media.cover || media.cover === 'N/A' ? 'assets/images/default-cover.jpg' : media.cover" 
                         [alt]="media.name" 
                         [title]="media.name"/>
                </div>
                <div class="card-info">
                    <h3 [title]="media.name">{{ media.name }}</h3>
                </div>
            </div>
        } @empty {
            <div class="empty-state">
                <p>Sua lista ainda está vazia. 
                   <a routerLink="/home">Procure um jogo</a> para começar!
                </p>
            </div>
        }
    </div>
</div>
