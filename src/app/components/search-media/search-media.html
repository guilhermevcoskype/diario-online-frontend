<div class="search-results-container">
    @if (loading()) {
        <div class="loading-wrapper">
            <div class="spinner"></div>
            <p>Buscando mídias...</p>
        </div>
    } @else {
        <div class="games-grid">
            @for (media of inputMediaList(); track media.gameId) {
                <div class="game-card" (click)="goMediaPage(media)">
                    <div class="card-image">
                        <img [src]="!media.cover || media.cover === 'N/A' ? 'images/default-cover.jpg' : media.cover" 
                             [alt]="media.name" 
                             [title]="media.name"/>
                    </div>
                    <div class="card-info">
                        <h3 [title]="media.name">{{ media.name }}</h3>
                    </div>
                </div>
            } @empty {
                <div class="empty-results">
                    <p>Nenhum resultado encontrado para sua busca.</p>
                </div>
            }
        </div>
    }
</div>
